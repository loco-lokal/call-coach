services:
  web:
    environment:
      COMPONENT_PREVIEW: "true"
    restart: "no"
  api:
    environment:
      PUBLIC_APP_URL: http://web:3000
  playwright:
    build:
      context: .
      target: playwright
    environment:
      BASE_URL: http://web:3000
      CI: "true"
      TEST_PASSWORD: ${CALL_COACH_PASSWORD}
      TEST_API_KEY: ${CALL_COACH_API_KEY}
      PLAYWRIGHT_HTML_REPORT: /reports/html
      PLAYWRIGHT_OUTPUT_DIR: /reports/results
      UI_EVIDENCE_DIR: /reports/evidence
    volumes:
      - ./playwright-report:/reports
    ipc: host
    init: true
    depends_on:
      web: {condition: service_healthy}
  api-tests:
    build:
      context: ./backend
      target: tests
    environment:
      TEST_DATABASE_URL: postgres://callcoach:${POSTGRES_PASSWORD}@db:5432/callcoach?sslmode=disable
    depends_on:
      db: {condition: service_healthy}
    profiles: [test]
