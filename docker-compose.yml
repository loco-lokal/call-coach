name: call-coach
x-api-env: &api-env
  DATABASE_URL: postgres://callcoach:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/callcoach?sslmode=disable
  CALL_COACH_PASSWORD: ${CALL_COACH_PASSWORD:?Set CALL_COACH_PASSWORD in .env}
  CALL_COACH_API_KEY: ${CALL_COACH_API_KEY:?Set CALL_COACH_API_KEY in .env}
  PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://127.0.0.1:3000}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}
  LOG_LEVEL: ${LOG_LEVEL:-info}
services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: callcoach
      POSTGRES_USER: callcoach
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callcoach -d callcoach"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
  migrate:
    image: call-coach-api:local
    build:
      context: ./backend
      target: runtime
    command: [migrate]
    environment: *api-env
    depends_on:
      db: {condition: service_healthy}
    restart: "no"
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  api:
    image: call-coach-api:local
    build:
      context: ./backend
      target: runtime
    environment: *api-env
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/api", "health"]
      interval: 3s
      timeout: 3s
      retries: 20
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
  web:
    build:
      context: .
      target: runtime
    image: call-coach-web:local
    environment:
      COMPONENT_PREVIEW: ${COMPONENT_PREVIEW:-false}
      INTERNAL_API_URL: http://api:8080
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api: {condition: service_healthy}
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
volumes:
  postgres-data:
