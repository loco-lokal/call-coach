{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "call-coach.name" . }}-db
spec:
  clusterIP: None
  selector:
    {{- include "call-coach.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: db
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "call-coach.name" . }}-db
spec:
  serviceName: {{ include "call-coach.name" . }}-db
  replicas: 1
  selector:
    matchLabels:
      {{- include "call-coach.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: db
  template:
    metadata:
      labels:
        {{- include "call-coach.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: db
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: {{ .Values.postgresql.image | quote }}
          env:
            - {name: POSTGRES_DB, value: callcoach}
            - {name: POSTGRES_USER, value: callcoach}
            - {name: PGDATA, value: /var/lib/postgresql/18/docker}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: POSTGRES_PASSWORD
          ports:
            - {name: postgres, containerPort: 5432}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            exec: {command: [pg_isready, -U, callcoach, -d, callcoach]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: [pg_isready, -U, callcoach, -d, callcoach]}
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql}
            - {name: tmp, mountPath: /tmp}
            - {name: socket, mountPath: /var/run/postgresql}
      volumes:
        - {name: tmp, emptyDir: {}}
        - {name: socket, emptyDir: {}}
  volumeClaimTemplates:
    - metadata:
        name: data
        annotations:
          helm.sh/resource-policy: keep
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.postgresql.storageClass }}
        storageClassName: {{ .Values.postgresql.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.storage }}
{{- end }}
