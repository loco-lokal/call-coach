apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "call-coach.name" . }}-api
  labels:
    {{- include "call-coach.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "call-coach.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "call-coach.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: migrate
          image: {{ printf "%s:%s" .Values.apiImage.repository .Values.apiImage.tag | quote }}
          imagePullPolicy: {{ .Values.apiImage.pullPolicy }}
          args: [migrate]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "existingSecret is required" .Values.existingSecret }}
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            {{- toYaml .Values.apiResources | nindent 12 }}
      containers:
        - name: api
          image: {{ printf "%s:%s" .Values.apiImage.repository .Values.apiImage.tag | quote }}
          imagePullPolicy: {{ .Values.apiImage.pullPolicy }}
          ports:
            - {name: http, containerPort: 8080}
          env:
            {{- range $key := list "DATABASE_URL" "CALL_COACH_PASSWORD" "CALL_COACH_API_KEY" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.existingSecret }}
                  key: {{ $key }}
            {{- end }}
            - name: PUBLIC_APP_URL
              value: {{ .Values.publicAppUrl | quote }}
            - name: SESSION_TTL_HOURS
              value: {{ .Values.sessionTtlHours | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: COOKIE_SECURE
              value: {{ .Values.cookieSecure | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          resources:
            {{- toYaml .Values.apiResources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "call-coach.name" . }}-api
spec:
  type: ClusterIP
  selector:
    {{- include "call-coach.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - {name: http, port: 8080, targetPort: http}
