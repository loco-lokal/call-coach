{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "call-coach.name" . }}-api
spec:
  podSelector:
    matchLabels:
      {{- include "call-coach.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "call-coach.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: web
      ports: [{protocol: TCP, port: 8080}]
{{- if .Values.postgresql.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "call-coach.name" . }}-db
spec:
  podSelector:
    matchLabels:
      {{- include "call-coach.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: db
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "call-coach.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: api
      ports: [{protocol: TCP, port: 5432}]
{{- end }}
{{- end }}
