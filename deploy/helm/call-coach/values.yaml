replicaCount: 1
image:
  repository: call-coach-web
  tag: "1.0.0"
  pullPolicy: IfNotPresent
apiImage:
  repository: call-coach-api
  tag: "1.0.0"
  pullPolicy: IfNotPresent
imagePullSecrets: []
# Pre-create this Secret; values must never contain credentials.
# Required keys: CALL_COACH_PASSWORD, CALL_COACH_API_KEY, DATABASE_URL.
# Bundled PostgreSQL also requires POSTGRES_PASSWORD.
existingSecret: call-coach-secrets
publicAppUrl: https://calls.example.com
cookieSecure: true
sessionTtlHours: 24
logLevel: info
componentPreview: false
service:
  port: 80
ingress:
  enabled: false
  className: ""
  host: calls.example.com
  annotations: {}
  tls: []
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: "1", memory: 512Mi}
apiResources:
  requests: {cpu: 100m, memory: 64Mi}
  limits: {cpu: "1", memory: 256Mi}
postgresql:
  enabled: true
  image: postgres:18.6-bookworm
  storage: 10Gi
  storageClass: ""
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
networkPolicy:
  enabled: true
